# Continuous hardware path using the measured tip at action submission time.
# Keep this profile observational until the normal manager/motor preflight has
# passed; the action only arms through the guarded controller service.
frame_id: robot_base
action_name: /catheter_mppi/track_tip_path
marker_topic: /shape_tracking/markers
auto_arm: true

nominal_speed_mm_s: 2.0
total_timeout_s: 90.0
final_tolerance_mm: 1.8
final_settle_time_s: 0.30
soft_error_mm: 2.0
pause_error_mm: 5.0
resume_error_mm: 1.5
hard_error_mm: 15.0

generator:
  type: circle_yz_from_current_tip
  radius_mm: 10.0
  center_x_offset_mm: 10.0
  waypoint_count: 72
  direction: ccw
  close_circle: true
